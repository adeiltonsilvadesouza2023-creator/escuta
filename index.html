<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rádio Família</title>
  <!-- Biblioteca PeerJS para conectar os dois celulares direto via WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #111; color: #fff; font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 15px; text-align: center; font-size: 20px; font-weight: bold;
      background: #222; border-bottom: 2px solid #444;
    }
    #ptt {
      flex: 1; margin: 15px; border-radius: 25px; border: none;
      background: #1b5e20; color: white; font-size: 38px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      text-align: center; box-shadow: 0 8px 0 #0d3311; cursor: pointer;
      touch-action: none;
    }
    #ptt.falando { background: #c62828; box-shadow: 0 2px 0 #6b1111; transform: translateY(6px); }
    #ptt.ouvindo { background: #ef6c00; }
    #ptt:disabled { background: #444; box-shadow: none; color: #888; }
    #video-fallback {
      position: fixed; width: 1px; height: 1px; opacity: 0.001; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">TOQUE NA TELA PARA ATIVAR</div>
  <button id="ptt" disabled>AGUARDANDO...</button>
  <audio id="audioRemoto" autoplay playsinline></audio>

  <!-- Fallback silencioso caso o navegador/WebView não suporte Wake Lock nativo -->
  <video id="video-fallback" loop muted playsinline>
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAu1tZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjc5NSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMTcgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWw=" type="video/mp4">
  </video>

  <script>
    // IDENTIFICAÇÃO DOS APARELHOS (Mude a palavra-chave para algo único seu!)
    const ID_PAIS = "radio-casa-pais-998877";
    const ID_FILHO = "radio-casa-filho-998877";

    // Se abrir o link com ?pais no final, ele assume o papel do celular dos seus pais
    const souOsPais = location.search.includes("pais");
    const meuId = souOsPais ? ID_PAIS : ID_FILHO;
    const destinoId = souOsPais ? ID_FILHO : ID_PAIS;

    const btn = document.getElementById('ptt');
    const status = document.getElementById('status');
    const audioRemoto = document.getElementById('audioRemoto');
    const videoFallback = document.getElementById('video-fallback');

    let meuStream, peer, chamadaAtiva;
    let wakeLock = null;
    let falandoAgora = false;
    let ouvindoAgora = false;

    function atualizarBotao() {
      if (btn.disabled) return;
      btn.classList.remove('falando', 'ouvindo');
      if (falandoAgora) {
        btn.classList.add('falando');
        btn.innerText = "FALANDO AGORA...";
      } else if (ouvindoAgora) {
        btn.classList.add('ouvindo');
        btn.innerText = "OUVINDO...";
      } else {
        btn.innerText = "SEGURE PARA FALAR";
      }
    }

    // Mantém a tela acesa enquanto o app/aba estiver ativo
    async function ativarManterTelaAcesa() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            wakeLock = null;
          });
        }
      } catch (e) {
        // Se falhar (ex: bateria muito baixa ou bloqueio do sistema), usa fallback de vídeo
      }

      try {
        await videoFallback.play();
      } catch (e) {
        // Ignora caso bloqueado
      }
    }

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        if (meuStream) {
          await ativarManterTelaAcesa();
        }
        if (peer && peer.disconnected) {
          peer.reconnect();
        }
        if (peer && !peer.disconnected && meuStream && (!chamadaAtiva || !chamadaAtiva.open)) {
          conectarAoOutro();
        }
      }
    });

    // Inicia tudo no primeiro toque na tela (exigência do navegador)
    document.body.addEventListener('click', iniciarSistema, { once: true });
    document.body.addEventListener('touchstart', iniciarSistema, { once: true });

    async function iniciarSistema() {
      if (peer) {
        await ativarManterTelaAcesa();
        return;
      }

      status.innerText = "Liberando microfone e tela...";

      try {
        await ativarManterTelaAcesa();

        meuStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        // Começa com o microfone MUTADO (só abre quando segurar o botão)
        meuStream.getAudioTracks()[0].enabled = false;

        peer = new Peer(meuId);

        peer.on('open', () => {
          status.innerText = souOsPais ? "MODO: CASA DE CIMA (ONLINE)" : "MODO: MEU CELULAR (ONLINE)";
          status.style.color = "#4caf50";
          btn.disabled = false;
          atualizarBotao();
          conectarAoOutro();
        });

        // Quando o outro celular ligar para este, atende automaticamente sem precisar clicar
        peer.on('call', (call) => {
          call.answer(meuStream);
          configurarAudio(call);
        });

        // Reconecta automaticamente se a rede oscilar
        peer.on('disconnected', () => {
          status.innerText = "Reconectando...";
          status.style.color = "#ffb300";
          peer.reconnect();
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            status.innerText = "ID já conectado em outra janela/aba";
            status.style.color = "#ffb300";
          }
        });

      } catch (err) {
        status.innerText = "ERRO NO MICROFONE: " + err.message;
        status.style.color = "#f44336";
      }
    }

    function conectarAoOutro() {
      if (!peer || peer.disconnected || !meuStream) return;
      const call = peer.call(destinoId, meuStream);
      if (call) configurarAudio(call);
    }

    function configurarAudio(call) {
      chamadaAtiva = call;

      call.on('stream', (streamRemoto) => {
        audioRemoto.srcObject = streamRemoto;
        audioRemoto.play().catch(() => {});

        const audioTracks = streamRemoto.getAudioTracks();
        if (audioTracks.length > 0) {
          const track = audioTracks[0];
          track.onunmute = () => {
            ouvindoAgora = true;
            atualizarBotao();
          };
          track.onmute = () => {
            ouvindoAgora = false;
            atualizarBotao();
          };
          track.onended = () => {
            ouvindoAgora = false;
            atualizarBotao();
          };
        }
      });

      call.on('close', () => {
        ouvindoAgora = false;
        atualizarBotao();
      });

      call.on('error', () => {
        ouvindoAgora = false;
        atualizarBotao();
      });
    }

    // Controle do Botão Gigante (Abre e fecha o microfone instantaneamente)
    async function apertarBotao(e) {
      e.preventDefault();
      if (!meuStream) {
        await iniciarSistema();
        return;
      }

      await ativarManterTelaAcesa();

      if (peer && peer.disconnected) {
        peer.reconnect();
      }
      if (!chamadaAtiva || !chamadaAtiva.open) {
        conectarAoOutro();
      }

      meuStream.getAudioTracks().forEach((track) => {
        track.enabled = true;
      });
      falandoAgora = true;
      atualizarBotao();
    }

    function soltarBotao(e) {
      e.preventDefault();
      if (meuStream) {
        meuStream.getAudioTracks().forEach((track) => {
          track.enabled = false;
        });
      }
      falandoAgora = false;
      atualizarBotao();
    }

    btn.addEventListener('touchstart', apertarBotao, { passive: false });
    btn.addEventListener('touchend', soltarBotao, { passive: false });
    btn.addEventListener('touchcancel', soltarBotao, { passive: false });
    btn.addEventListener('mousedown', apertarBotao);
    btn.addEventListener('mouseup', soltarBotao);
    btn.addEventListener('mouseleave', () => {
      if (falandoAgora) soltarBotao({ preventDefault: () => {} });
    });
  </script>
</body>
</html>
