<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rádio Família</title>
  <!-- Biblioteca PeerJS para conectar os dois celulares direto via WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: #111; color: #fff; font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #status {
      padding: 15px; text-align: center; font-size: 18px; font-weight: bold;
      background: #222; border-bottom: 2px solid #444; line-height: 1.3;
    }
    #ptt {
      flex: 1; margin: 15px; border-radius: 25px; border: none;
      background: #1b5e20; color: white; font-size: 36px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      text-align: center; box-shadow: 0 8px 0 #0d3311; cursor: pointer;
      touch-action: none; padding: 16px;
    }
    #ptt.falando { background: #c62828; box-shadow: 0 2px 0 #6b1111; transform: translateY(6px); }
    #ptt.ouvindo { background: #ef6c00; }
    #ptt:disabled { background: #444; box-shadow: none; color: #aaa; font-size: 28px; }
    #video-fallback {
      position: fixed; width: 1px; height: 1px; opacity: 0.001; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">TOQUE NA TELA PARA ATIVAR</div>
  <button id="ptt" disabled>TOQUE PARA INICIAR</button>
  <audio id="audioRemoto" autoplay playsinline></audio>

  <!-- Fallback silencioso caso o navegador/WebView não suporte Wake Lock nativo -->
  <video id="video-fallback" loop muted playsinline>
    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAu1tZGF0AAACrgYF//+q3EXpvebZSLeWLNgg2SPu73gyNjQgLSBjb3JlIDE0OCByMjc5NSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMTcgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWw=" type="video/mp4">
  </video>

  <script>
    // IDENTIFICAÇÃO DOS APARELHOS (Mude a palavra-chave para algo único seu!)
    const ID_PAIS = "radio-casa-pais-998877";
    const ID_FILHO = "radio-casa-filho-998877";

    // Se abrir o link com ?pais no final, ele assume o papel do celular dos seus pais
    const souOsPais = location.search.includes("pais");
    const meuId = souOsPais ? ID_PAIS : ID_FILHO;
    const destinoId = souOsPais ? ID_FILHO : ID_PAIS;

    const btn = document.getElementById('ptt');
    const status = document.getElementById('status');
    const audioRemoto = document.getElementById('audioRemoto');
    const videoFallback = document.getElementById('video-fallback');

    let meuStream, peer, chamadaAtiva;
    let wakeLock = null;
    let falandoAgora = false;
    let ouvindoAgora = false;
    let iniciandoAgora = false;

    function setStatus(texto, cor = "#fff") {
      status.innerText = texto;
      status.style.color = cor;
    }

    function atualizarBotao() {
      if (btn.disabled) return;
      btn.classList.remove('falando', 'ouvindo');
      if (falandoAgora) {
        btn.classList.add('falando');
        btn.innerText = "FALANDO AGORA...";
      } else if (ouvindoAgora) {
        btn.classList.add('ouvindo');
        btn.innerText = "OUVINDO...";
      } else {
        btn.innerText = "SEGURE PARA FALAR";
      }
    }

    // Mantém a tela acesa sem bloquear o fluxo principal se falhar
    function ativarManterTelaAcesa() {
      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen')
          .then((lock) => {
            wakeLock = lock;
            lock.addEventListener('release', () => {
              wakeLock = null;
            });
          })
          .catch(() => {});
      }

      if (videoFallback) {
        videoFallback.play().catch(() => {});
      }
    }

    // Evita que getUserMedia fique pendurado eternamente sem resposta do navegador
    function pedirMicrofoneComTimeout(ms = 12000) {
      return new Promise(async (resolve, reject) => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          reject(new Error("Navegador sem suporte a microfone (getUserMedia)"));
          return;
        }

        const timer = setTimeout(() => {
          reject(new Error("Tempo esgotado ao pedir microfone. Verifique a permissão do site no navegador."));
        }, ms);

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          clearTimeout(timer);
          resolve(stream);
        } catch (err) {
          clearTimeout(timer);
          reject(err);
        }
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (meuStream) {
          ativarManterTelaAcesa();
        }
        if (peer && peer.disconnected) {
          peer.reconnect();
        }
        if (peer && !peer.disconnected && meuStream && (!chamadaAtiva || !chamadaAtiva.open)) {
          conectarAoOutro();
        }
      }
    });

    async function iniciarSistema() {
      if (iniciandoAgora) return;

      if (peer && meuStream) {
        ativarManterTelaAcesa();
        if (peer.disconnected) peer.reconnect();
        return;
      }

      iniciandoAgora = true;
      btn.disabled = true;
      btn.innerText = "LIBERANDO...";
      setStatus("1/2 - Solicitando permissão do microfone...", "#ffeb3b");
      ativarManterTelaAcesa();

      try {
        meuStream = await pedirMicrofoneComTimeout(12000);

        // Começa com o microfone MUTADO (só abre quando segurar o botão)
        meuStream.getAudioTracks().forEach((track) => {
          track.enabled = false;
        });

        setStatus("2/2 - Conectando ao servidor de sinalização...", "#ffeb3b");

        if (typeof Peer === "undefined") {
          throw new Error("Biblioteca PeerJS não carregou. Verifique a conexão com a internet.");
        }

        peer = new Peer(meuId);

        peer.on('open', () => {
          iniciandoAgora = false;
          setStatus(souOsPais ? "MODO: CASA DE CIMA (ONLINE)" : "MODO: MEU CELULAR (ONLINE)", "#4caf50");
          btn.disabled = false;
          atualizarBotao();
          conectarAoOutro();
        });

        peer.on('call', (call) => {
          call.answer(meuStream);
          configurarAudio(call);
        });

        peer.on('disconnected', () => {
          setStatus("Reconectando...", "#ffb300");
          peer.reconnect();
        });

        peer.on('error', (err) => {
          iniciandoAgora = false;
          if (err.type === 'unavailable-id') {
            setStatus("ID já conectado em outra aba/aparelho. Toque para tentar.", "#ffb300");
            btn.disabled = false;
            btn.innerText = "TENTAR NOVAMENTE";
          } else {
            setStatus("Erro de conexão: " + (err.type || err.message), "#f44336");
            btn.disabled = false;
            btn.innerText = "TENTAR NOVAMENTE";
          }
        });

      } catch (err) {
        iniciandoAgora = false;
        peer = null;
        btn.disabled = false;
        btn.innerText = "TOQUE PARA TENTAR";
        setStatus("ERRO: " + err.message, "#f44336");
      }
    }

    // Qualquer toque na tela ou no botão inicia se ainda não estiver iniciado
    document.body.addEventListener('click', (e) => {
      if (!meuStream || !peer) {
        iniciarSistema();
      }
    });

    document.body.addEventListener('touchstart', (e) => {
      if (!meuStream || !peer) {
        iniciarSistema();
      }
    }, { passive: true });

    function conectarAoOutro() {
      if (!peer || peer.disconnected || !meuStream) return;
      const call = peer.call(destinoId, meuStream);
      if (call) configurarAudio(call);
    }

    function configurarAudio(call) {
      chamadaAtiva = call;

      call.on('stream', (streamRemoto) => {
        audioRemoto.srcObject = streamRemoto;
        audioRemoto.play().catch(() => {});

        const audioTracks = streamRemoto.getAudioTracks();
        if (audioTracks.length > 0) {
          const track = audioTracks[0];
          track.onunmute = () => {
            ouvindoAgora = true;
            atualizarBotao();
          };
          track.onmute = () => {
            ouvindoAgora = false;
            atualizarBotao();
          };
          track.onended = () => {
            ouvindoAgora = false;
            atualizarBotao();
          };
        }
      });

      call.on('close', () => {
        ouvindoAgora = false;
        atualizarBotao();
      });

      call.on('error', () => {
        ouvindoAgora = false;
        atualizarBotao();
      });
    }

    async function apertarBotao(e) {
      e.preventDefault();
      if (!meuStream || !peer) {
        await iniciarSistema();
        return;
      }

      ativarManterTelaAcesa();

      if (peer.disconnected) {
        peer.reconnect();
      }
      if (!chamadaAtiva || !chamadaAtiva.open) {
        conectarAoOutro();
      }

      meuStream.getAudioTracks().forEach((track) => {
        track.enabled = true;
      });
      falandoAgora = true;
      atualizarBotao();
    }

    function soltarBotao(e) {
      e.preventDefault();
      if (meuStream) {
        meuStream.getAudioTracks().forEach((track) => {
          track.enabled = false;
        });
      }
      falandoAgora = false;
      atualizarBotao();
    }

    btn.addEventListener('touchstart', apertarBotao, { passive: false });
    btn.addEventListener('touchend', soltarBotao, { passive: false });
    btn.addEventListener('touchcancel', soltarBotao, { passive: false });
    btn.addEventListener('mousedown', apertarBotao);
    btn.addEventListener('mouseup', soltarBotao);
    btn.addEventListener('mouseleave', () => {
      if (falandoAgora) soltarBotao({ preventDefault: () => {} });
    });
  </script>
</body>
</html>
